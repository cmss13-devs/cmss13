author: "TrollerNoob"
delete-after: True
changes:
  - rscadd: "The last trip to Chinook 91 GSO station has seen a massive overhaul to the Almayer's Aerospace fleet! Be on the lookout for further upgrades, Pilots."
  - rscadd: "Hula Girl now shakes and bobs as the Alamo flies!"
  - rscadd: "Added the Pilot Optic to all pilot helmets, a tactical eyepiece that gives the ability to see IFF HUDs on friends and foe, firemission and direct fire impact zones and (in the future!) dangerous antiair or chaff zones."
  - ui: "Dropship Weapon Console camera given its own unique overlay."
  - bugfix: "Fixed CAS Camera being able to see into Metal and stronger roofs. You'll be able to see your Firemission play out still."
  - bugfix: "Fixed missing Firemission Length input during Firemission Creation."
  - bugfix: "Fixed null mount point on left electronic slot for the Normandy."
  - bugfix: "Fixed Laser and GAU ammo not properly recording the owner for kills"
  - bugfix: "Minimap now properly displays inside the console window, and is live updated."
  - refactor: "Refactored direct fire code to properly update the impact area when the signal is lost mid-transit."