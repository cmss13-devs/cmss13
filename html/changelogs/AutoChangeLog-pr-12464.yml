author: "Steelpoint, Dorodomki, Zenith"
delete-after: True
changes:
  - mapadd: "LV-1021: Operation Falcon's Fury has been added to the game. A regular ground map set on an uncharted Jungle world. The Marines of the USS Almayer have been dispatched to conduct a search and destroy operation against a known CLF training and logistics camp, however the Xenomorph threat unexpectedly reveals itself on this world."
  - rscadd: "CLF special forces uniforms and armour have been added to the game (Credit to Dorodomki)"
  - rscadd: "CANC military uniforms and armour have been added to the game as rare standard CLF gear and survivor loot (Credit to AmoryBlaine). (The CANC, known as the Chinese/Asian-Nation Cooperate, was a supranational entity that was absorbed into the UPP, their old gear may end up in the hands of desperate fighters)."
  - rscadd: "New wooden chest drawers have been added."
  - rscadd: "The CLF synthetic is now issued with a set of Synthetic compliant armor."
  - rscadd: "A new set of wooden walls, windows and dirt/grass floor sprites have been added, these are alternative color schemes of the current wooden walls (Credit to Zenith)."
  - rscadd: "A unmoveable, hacked CLF sentry gun and CLF M20 anti-personnel mines have been added to the game. The CLF mines have a new RNG spawner that can set a armed mine on the map."
  - imageadd: "New armour sprites for the CLF and CANC. New wooden wall, floor and window sprites. New red CLF beret."