author: "Steelpoint, Drathek"
delete-after: True
changes:
  - code_imp: "Closets and cm_vending vendors now are not intractable when they are in the same tile as a dense door (allowing them to be hidden in the door's tile)"
  - maptweak: "The Combat Information Centre of the USS Almayer has been refurnished and overhauled. The objective of this overhaul is to transform the CIC into a veritable command bunker that provides an improved experience for CIC personnel to better communicate and coordinate amongst each other, whilst also improving the security and personnel inflow of the CIC to diminish the need for non-USCM/civilian personnel from being able to enter and leave the CIC as they please."
  - maptweak: "Two additional Overwatch stations have been installed in the CIC."
  - maptweak: "The CIC armory is now concealed and hidden within the CIC conference room. It can be revealed by pressing the 'armoury' button."
  - maptweak: "The reception to the CIC has been refurbished to permit MP personnel to perform guard duty."
  - maptweak: "The CIC lockdown has been changed from a single overall lockdown, to three different tiers of lockdown. The external blast doors that lead into the general CIC adjacent corridors are now the External Lockdown. The blastdoors that prevent entry into the main CIC area is now the Interior Lockdown, with the final lockdown being reserved for the central command bunker. This will permit CIC staff to better control how they wish to secure the CIC during an emergency."