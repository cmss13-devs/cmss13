author: "Drathek"
delete-after: True
changes:
  - balance: "Survivors no longer grant extra bursts on nested capture but grant 0.5 larva on permadeath (if they didn't chestburst and its within the first hour of the round)"
  - code_imp: "Role authority now sets up survivors in a loop based on type rather than hardcoded for each kind of survivor job"
  - code_imp: "All previous calls to send COMSIG_HUMAN_SET_UNDEFIBBABLE now utilize a helper proc set_undefibbable instead"
  - config: "Default config for nested extra bursts set to the value live has it at"
  - bugfix: "Fixed chestbursting and gibbing not triggering the undefib signal"
  - bugfix: "Fixed a double qdel in the event a survivor tries to spawn without a landmark"
  - rscdel: "Removed the issurvivorjob since it was not considering a CO survivor job anyways (shouldn't change any behavior since orbit menu would fallback to faction_group)"
  - maptweak: "Added a survivor spawner to USS runtime so its possible to spawn as a normal survivor there"