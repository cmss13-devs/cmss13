author: "Riot"
delete-after: True
changes:
  - qol: "UPP Commando medics now have an inbuilt medical visor in their NVGs"
  - bugfix: "UPP Commando(Non Deathsquad) now spawns with a rifle, instead of nothing."
  - balance: "NP92 has 19 rounds per mag but does less damage, to fit the new description for it"
  - balance: "The QYJ-72(UPP Machinegun) now has full fire-rate regardless of whether it's bipodded or not, but has worse scatter and accuracy when not bipodded, it also has slightly more fire-rate in general."
  - balance: "The loadout Type 73 now has no damage buff, rendering it about in line with the other pistol choices stat-wise"
  - balance: "The UPP RPG isn't skill-locked again"
  - balance: "The UPP RPG's incendiary round has a very small explosion around the impact point"
  - balance: "Swaps the armor-penetration values of the normal and shrapnelshot ZHNK rounds, so it makes more sense"
  - spellcheck: "Redoes the description for and adds lore descriptions for most UPP weapons, all done by me"
  - spellcheck: "Renames the Type 88 DMR to FPA-299 so it's not 1-1 an IRL weapon, renames the Type 64 SMG to the PPZ-49/64 to cut down on the number of UPP weapons named 'Type-XYZ'"
  - spellcheck: "Re-chambers all UPP weapons so they use rounds more fitting to the setting"
  - spellcheck: "Loadout pistols that have stat-changes compared to normal versions now have a specially colored description part to signify that."