author: "Drathek, Steelpoint, DimDim"
delete-after: True
changes:
  - rscadd: "Added a lowpop survival mode which has an uncapped round start survivor amount of survivors vs xenos. Late joining as survivor is somewhat limited. Survivors can attempt to hold static comms ~15 minutes (with alert at half way) to get an escape shuttle, but its otherwise a deathmatch. Queen will be enclosed in skeletal resin until 30 minutes have elapsed, they're escaping, or there's only a few xenos left."
  - rscadd: "Added skeletal resin subtype that larva can burrow through if there's an open turf up to a couple tiles away on the other side"
  - rscadd: "Added basic logic for a clientless queen to ovi, set pheros and leaders"
  - rscadd: "Added Skeletal resin doors that are indestructible (but only mapped in) and added structure_spawners to spawn them; they chomp on humans if they are standing in their way."
  - rscadd: "Added item_pool_spawner, static_comms, fog_blocker, and door_blocker for item spawning, unique comms locations for this mode, and blockers that lift when the shuttle is called for this mode. /obj/effect/spawner/random also supports a gamemode flag too tho it probably should only be used in conjunction with spawn_on_roundstart."
  - rscadd: "Map configs can now override survivor types by mode"
  - rscadd: "Added a skill pamphlet that can set your skill level to trained and is the same layer as comms tower (it is spawned on the tower in this mode, and if its out of reach try shooting it)"
  - bugfix: "Mapped high priority roles (namely for WO) now update the preview doll"
  - bugfix: "ERT shuttles now unlock doors upon arrival"
  - bugfix: "Fixed incorrect SPAN header usage for WO announcements"
  - bugfix: "Fixed mapping subsystem trying to preload non-dmm files"
  - bugfix: "Evo buff now restores the previous allow_no_queen_evo rather than forcing it false"
  - bugfix: "Fixed CMTV appearing at world origin (atleast for this mode) at round start"
  - bugfix: "Fixed xeno resin doors not blending with walls correctly on spawn"
  - bugfix: "Fixed ERT shuttle doors not force closing doors on launch"
  - bugfix: "Antidelay for xeno tacmap and cloak fizzle now only checks humans (no synths, preds, or monkeys) and skips nested"
  - bugfix: "count_humans_and_xenos for round end checks now checks should_block_game_interaction too and has other misc changes"
  - bugfix: "Last human anti-delay checks now are also performed on nest (not just death) as well as survivor evac shuttle departure"
  - bugfix: "Check win and anti-delay checks on humans now handle if mobs are in vehicles"
  - bugfix: "Survivors now always register a minimap marker even if their headset has no hud"
  - code_imp: "ERTs now weakref members"
  - code_imp: "Shuttle arrival and prearrival now have a signal"
  - code_imp: "Survivor announcement helper is simplified"
  - code_imp: "Gamemodes can now specify a maximum number of players before its no longer voteable"
  - code_imp: "MODE_HAS_FLAG now has a null check for the mode"
  - code_imp: "Cleaned up survivor handle_equip_gear code namely to handle mapped roles like Survivor Unlimited"
  - code_imp: "Fog blockers now support infinite delay without making unnecessary timers"
  - code_imp: "item_pool_spawner have been cleaned up and now support providing it a list of type paths to pick from as well as a multiplier"
  - code_imp: "Moved update_energy_scale into latejoin_update and removed unnecessary update_gear_scale calls for 0 weight"
  - spellcheck: "Tweaked hive buff messages to be grant/bless instead of purchase and turned some late join prompts into questions rather than statements"
  - rscdel: "Removed unnecessary mind list in ticker"
  - server: "Adds more statistics to round results db for new round result types"
  - admin: "Added a verb to manually grant a hive buffs (has reduced restrictions to grant it)"
  - mapadd: "Added a version of the alamo that is an ERT shuttle and a version of the uscm station that can accommodate it"
  - maptweak: "Updated a bunch of maps to accommodate survivor mode changes"
  - qol: "Added xeno and queen character previews to better indicate if they're high priority job"
  - qol: "Game mode is no longer displayed in new player stats panel until the mode is loaded (instead of blindly saying Distress Signal)"
  - qol: "Late joining as a xeno as a new player can now prompt a tutorial suggestion"
  - imageadd: "Added various coderspites for new landmarks and skeletal resin doors by DimDim"