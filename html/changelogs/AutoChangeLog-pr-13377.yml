author: "TrollerNoob"
delete-after: True
changes:
  - rscadd: "The Almayer's Aerospace fleet's expansion continues!"
  - rscadd: "Added a falling shell effect for most CAS ammo types."
  - balance: "PGU-105 30mm Anti-tank ammo crate fires volleys 25% faster and now fires 50 times per volley, up from 40. It can now pierce metal roofs on direct fire."
  - balance: "GBU-67 'Keeper II' min and max accuracy decreased to 2 and 3 tiles, making it much more accurate. It can now pierce metal roofs on direct fire."
  - balance: "BLU-200 'Dragon's Breath' pull range lowered by 1, now has 2 miniature explosions."
  - balance: "HPU-1 Paradrop Deployment System's cost increased from 50 to 150."
  - qol: "You can now lock a destination on the Dropship Flight Console by pressing the lock icon. This will automatically select that destination on refuel, includes flyby."
  - qol: "Re-ordered Dropship Flight Console's door lock buttons to be more intuitive. Left button locks left door, middle button locks middle door, right button locks right door."
  - qol: "You can now use your movement keys to offset the CAS camera. You must be buckled into the pilot seat."
  - qol: "Firemission input steps now save when uninstalling equipment. You no longer have to re-input them each time."
  - qol: "You can now refill Minirocket ammo while they're installed without having to unload the ammo."
  - qol: "Dropship Part Fabricator now categorizes equipment and ammo by where they can be installed."
  - qol: "Fulton now has an audible and text cue whenever a fulton is launched while in flight."
  - qol: "Medevac now has an audible and text cue whenever a stretcher is activated while in flight."
  - qol: "Paradrop now has audible and visual cues to better let marines know when it's time to jump."
  - qol: "AN/AAQ-178 Weapon Targeting System can now be toggled on and off while mid-flight, letting you forgo the effects tactically."
  - imageadd: "Added projectile icon states for each ship ammo type."
  - imageadd: "Added new icon states for the HPU-1 Paradrop Deployment System."
  - imageadd: "Added new icon states for BLU-200 'Dragon's Breath'."
  - imageadd: "Added an on state for the AN/AAQ-178 Weapon Targeting System."
  - refactor: "Refactored fabricator code to get each equipment's mount point in order to categorize them."
  - refactor: "Refactored Minirocket code to use the modern global proc ref."
  - refactor: "Refactored GAU simulation code, now allows looping values less than 1 second"
  - code_imp: "Changed Cavebreaker from being an Equipment var to an Ammo var, added a Metal Breaker var for metal roofs."
  - code_imp: "Added backend information for the Weapon Console, consisting of equipment data, flight data, firemission data and ceiling data."