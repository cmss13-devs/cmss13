author: "TrollerNoob"
delete-after: True
changes:
  - rscadd: "Added a variety of telegraph VFX to Xenomorph Abilities across the board."
  - rscadd: "Xenomorph movement abilities now kick up a dust cloud on the tile they moved from, unless they are cloaked."
  - rscadd: "Xenomorph slash enhancing abilities now have a custom slash animation."
  - rscadd: "Base Ravager's abilities now visually change when being enhanced with enough shield gained from Empower."
  - imageadd: "Added a greyscale xeno telegraph border to be used and recolored for telegraph effects."
  - imageadd: "Added telegraph states for the Flurry, Tail Jab/Pierce, Vanguard Dash Slash, Tremor/Stomp/High Gallop, Scissor Cut, Eviscerate and Caustic Embrace Xenomorph abilities."
  - imageadd: "Added attack states for the Clothesline, Apprehend, Crippling Strike, Crippling Strike Tail Strike, Toxic Slash and Toxic Slash Tail Strike Xenomorph abilities."
  - imageadd: "Added a big and small dust cloud effect for Xenomorph movement abilities."