author: "TrollerNoob"
delete-after: True
changes:
  - ui: "Added a Xenomorph Information Panel which displays visual information regarding a caste or strain when evolving, de-evolving or choosing a strain. Hover over an ability to see what it does."
  - ui: "Added ability descriptions and stat information in the Xenomorph Information Panel."
  - qol: "Strain Information verb now displays the Information Panel of your current caste or strain."
  - refactor: "Refactored xeno ability/resource backend to work with the Information Panel."
  - refactor: "Refactored Health Scan ui to share its damage colors with the Xenomorph Information Panel."
  - refactor: "Standardized and replaced hard numbers for xeno ability vars to make future balancing easier."
  - bugfix: "Fixed Hellhound's Find Owner not displaying the message when alone."
  - bugfix: "Dancer's Tail Trip no longer applies its normal cooldown after hitting a golden tagged target."